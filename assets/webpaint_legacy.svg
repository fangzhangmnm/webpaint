<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- WebPaint 本地图标补丁 sprite —— 共享库（20260708 SVG Icons）里还没有的图标。

     这个文件是【给美工 agent 的候选清单】，不是永久分叉。
     每个 symbol 的 id 都用「最终语义名」命名，所以图标一旦进库：
       重跑 extract-icons.py → tools/inline-sprites.py 检测到 assets/icons.svg 里已有同名 symbol
       → 自动丢弃这里的副本 → 宿主的 <use href="#name"> 一个字都不用改。
     即：把图标画进库，就是删掉这里一条的过程，自愈。

     两类：
       data-cat="legacy"  = WebPaint 已有的图形，从内联 svg 搬过来的，图形本身可用，只是库里没有。
       data-cat="stopgap" = 库里没有图形，先用【单个汉字】顶住位置。

     ⚠ stopgap 的局限（写给美工 agent 看）：
       单汉字只解决「占地」问题——一个汉字 ≈ 一个图标宽，换成英文长词会把窄 UI 条撑爆。
       它【不解决 pictogram 问题】：不认字的小孩看不懂「裁」「棋」「散」。
       而 WebPaint 加图标的初衷正是给不认字的小孩和找不到语言设置的人用。
       所以 data-cat="stopgap" 的每一条都是过渡态，都需要真图形替换。优先级看各自的 data-note。

     注：菜单里没有图标的项不是漏了——用户明确要求那些「留空」（空位保持文字对齐），
     不要为了填满而硬塞图标。所以这个清单只覆盖确实需要图形的位置。

     样式契约沿用库的：viewBox 0 0 24 24 / fill=none stroke=currentColor stroke-width=1.7 / round caps。
     单字 symbol 例外：走 <text fill=currentColor stroke=none>（与库里 fx 图标同款做法）。
     字形依赖设备字体，中日文渲染会有差异；cairosvg 本地渲 CJK 出豆腐块属正常，别据此判断对错。

     ══════════ 用户实测反馈（原话，2026-07-18）══════════
     下面这些是【人】看着真界面提的，不是 AI 的推断。可信度跟本文件其它 data-note 不是一个级别，
     有冲突时以这里为准：

       ·「create a larger version of eye and eye-hide in legacy. current version is toooo small」
          → 库里的 visibility-show / visibility-hide 在真界面上太小。本文件已做 1.35 倍放大覆盖。
             【入库时请直接把库里那两个画大，别让 app 层长期分叉。】

       ·「opacity have bugs, use 透 for placeholder」
          → 库里的 transparency 图标用户实测有问题（具体现象未展开），已退回单字「透」顶位。
             画 opacity 图标之前，先去核对 transparency 到底哪里不对。

       ·「theme 应该是日/夜，用夜字placeholder」
          → 主题切换的语义是日/夜。之前误用了 color-palette（那是取色，语义不对）。已换单字「夜」。

       ·「dont use eraser for clear layer, use a 清 for both layers and selection.clear」
          → 「清空图层内容」和「清除选区内像素」是同一件事，共用一个图标；且不要用橡皮
             （橡皮是工具，这两个是一次性命令）。两处都指向 clear-pixels。

       ·「we need a 名 for rename. also the rename in menu and in layer」
          → 重命名出现在主菜单、图层菜单、图库瓦片菜单三处，统一用 rename（名）。

       ·「use 复制选区到新层 for layer duplication」
          → 图层「复制」与套索「复制选区到新层」共用 copy 图标，别拆成两个。

       ·「export project用同样的export」
          → 「导出项目(.ora)」与「导出图片」共用 export 图标，不另做区分。
             （我原本给它单独做了「项」顶位，已按此删掉。）

       ·「we do not need to add icons for all menu options. just make them blank (not missing)」
          → 宁可留空也不要硬凑。留空 ≠ 缺图标占位框。已留空的菜单项见 index.html 的
             .menu-item-icon-blank。别把它们当成待办塞进来。
     ═════════════════════════════════════════════════
-->

