# 部署 GitHub Pages：prod 分支 → /，main 分支 → /dev/
#
# 各分支自己已经 commit 好 dist/main-<hash>.mjs（人手跑 build.sh 后 commit）。
# 本 workflow 只做"组合两分支 → upload"，**不重 build**，因此快、确定性高。
#
# 第一次 setup：手动建 prod 分支 → push（否则 checkout prod 会 fail）：
#   git checkout -b prod && git push -u origin prod
#
# 论证 / sibling 抄法：ai-docs/20260529-dev-prod-split.md
name: Deploy Pages

on:
  push:
    branches: [main, prod]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # v130 (user prod race 踩坑后)：
  #   原本 false → 排队，main+prod 几乎同 push 时 workflow A 的 "checkout prod"
  #   先于 prod push 落到 GitHub，A 用旧 prod tree 部署了；B 后跑被 Pages 静默 collapse。
  #   改 true → 新 push 来时取消正在跑的旧 workflow，最后那次必赢。
  #   副作用：连续 push（调代码 1 分钟 3 次）只最后 deploy 生效，dev/ 这无所谓。
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout prod branch
        uses: actions/checkout@v4
        with:
          ref: prod
          path: prod-tree

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-tree

      - name: Compose site (prod=/, main=/dev/)
        run: |
          mkdir -p site/dev
          # 根级 PWA 元数据 + 图标 + SW + 运行时资源 (styles / brushes data)
          # v122 r2: styles.css / builtin-brushes.json / vendor/ 从 src/ 挪到根
          #
          # ⚠ 这个列表写错文件名不会让部署失败——`|| true` 会把 cp 的失败咽掉，站点照发，
          #   只是**少一个文件**。已经踩过一次：文件在 f49e60b 被从 default-brushes.json 改名成
          #   builtin-brushes.json，这里没跟着改 → 出厂笔刷 JSON **从此再没被部署过**，
          #   线上 404、每台新设备都只剩一支 emergency「默认笔」，而且完全静默。
          #   所以下面拷不到就打 ::warning::（GH Actions 摘要里显眼），别再让它无声无息。
          #   仍不 fail：prod 与 main 的文件集合本来就可能不同步（新文件先落 main），硬失败会互相卡住。
          #   v0.7.33 又踩一次同款：v0.7.32 新增的 canvas-templates.json（画布尺寸模板 SSoT）
          #   忘了加进这个列表 → /dev/ 上 404 → 新建作品和裁切两个尺寸下拉框全空（只剩「自定义」）。
          #   **加任何 runtime fetch 的根目录 asset，必须同时改三处**：SW 的 STATIC_PRECACHE、
          #   这个列表、以及（若有）离线测试。
          for f in index.html manifest.webmanifest service-worker.js styles.css builtin-brushes.json \
                   color-words.json canvas-templates.json \
                   icon.svg icon-32.png icon-192.png icon-512.png apple-touch-icon-180.png; do
            cp -p prod-tree/$f site/     2>/dev/null || echo "::warning::prod 缺 $f —— / 上会 404"
            cp -p main-tree/$f site/dev/ 2>/dev/null || echo "::warning::main 缺 $f —— /dev/ 上会 404"
          done
          # 运行时 UMD libs + bundle 产物。src/ 是构建输入不进 deploy（bundle 后里头啥都不需要）
          cp -r prod-tree/vendor site/
          cp -r prod-tree/dist   site/
          cp -r main-tree/vendor site/dev/
          cp -r main-tree/dist   site/dev/
          # /dev/ 也要 SW（已上面 cp 到 site/dev/）：worker 按 scope 走 network-first——在线「改完即见」不变，
          #   离线才回退缓存（修「/dev/ 无 SW → 闪退离线打不开」的坑，见 ai-docs/20260630-pwa-offline-dev-sw.md）。

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
